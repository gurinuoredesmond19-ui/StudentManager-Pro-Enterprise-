<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | StudentManager Pro Enterprise</title>


<!------------------- CSS FILE--------------------->

<link rel="stylesheet" href="assets/css/theme.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/forms.css">
<link rel="stylesheet" href="assets/css/tables.css">
<link rel="stylesheet" href="assets/css/modal.css">
<link rel="stylesheet" href="assets/css/toast.css">
<link rel="stylesheet" href="assets/css/animations.css">
<link rel="stylesheet" href="assets/css/responsive.css">
<link rel="stylesheet" href="assets/css/login.css">

</head>
<body>

  <div class="login-page">

    <div class="login-left">
      <img src="assets/images/logo.png"
      class="login-logo" 
      alt="Logo">

      <h1>
        StudentManager Pro
      </h1>

      <p>
        Enterprise School Management System
      </p>

    </div>

    <div class="login-right">

      <div class=" app-card login-card">

        <h2>
          Welcome Back
        </h2>

        <p>
          Please sign in to continue.
        </p>

        <form id="loginForm">
           <div class="app-form-group">

            <label>
              Email or Username
            </label>
            <input type="text"
             id="username" 
             class="app-input"
             placeholder="Enter email or username">
           </div>

           <div class="app-form-group">

            <label>
              Password
            </label>
            
            <input type="password"
            id="password"
            class="app-input"
            placeholder="Enter password">
           </div>


           <div class="login-options">

            <label>
              
              <input type="checkbox">

              Remember Me

            </label>

            <a href="#">
              Forgot Password?
            </a>
           </div>


           <button type="submit"
           class="app-btn
           app-btn-primary
           app-btn-block">

             Sign In

          </button>
           
        </form>

      </div> 


    </div>


  </div>














<!--------------------JavaScript Fuction-------------->

  <script src="assets/js/core/app.js"></script>

<script src="assets/js/engines/modal.js"></script>
<script src="assets/js/engines/toast.js"></script>
<script src="assets/js/engines/sidebar.js"></script>
<script src="assets/js/engines/dropdown.js"></script>
<script src="assets/js/engines/loading.js"></script>
<script src="assets/js/engines/search.js"></script>
<script src="assets/js/engines/table.js"></script>
<script src="assets/js/engines/pagination.js"></script>
<script src="assets/js/engines/print.js"></script>
<script src="assets/js/engines/export.js"></script>
<script src="assets/js/engines/password.js"></script>
<script src="assets/js/engines/image.js"></script>
<script src="assets/js/engines/confirm.js"></script>
<script src="assets/js/engines/scroll.js"></script>
<script src="assets/js/engines/shortcuts.js"></script>
<script src="assets/js/engines/utils.js"></script>

<script src="assets/js/core/ui.js"></script>
<script type="module" src="assets/js/modules/auth.js"></script>


</body>
</html>
